<!DOCTYPE html>
<html data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Contact - LuisPeche</title>
    <link rel="icon" href="assets/img/avatars/perfil.jpg" type="image/jpg">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Lato.css">
    <link rel="stylesheet" href="assets/fonts/ionicons.min.css">
    <link rel="stylesheet" href="assets/css/bs-theme-overrides.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/Articles-Cards-images.css">
    <link rel="stylesheet" href="assets/css/Footer-Dark-icons.css">
    <link rel="stylesheet" href="assets/css/Lightbox-Gallery-baguetteBox.min.css">
    <link rel="stylesheet" href="assets/css/pikaday.min.css">
    <link rel="stylesheet" href="https://s.pageclip.co/v1/pageclip.css" media="screen">
</head>

<body>
    <!-- shared-navbar -->
    <main class="page contact-page">
        <section class="portfolio-block contact">
            <div class="container">
                <div class="heading">
                    
                    <h2 data-key="contact" data-value="contact-title">Contact me</h2>
                </div>         
                                                                    
                <form class="shadow-lg pageclip-form" data-bs-theme="light" action="https://send.pageclip.co/YU1nFAImNcbUjF7E3Mql1lMy0hhVcIjy/lrpa-form" method="post">
                    <div class="mb-3"><label class="form-label" for="name" data-key="contact" data-value="contact-name">Your Name</label><input class="form-control item" type="text"  name="name" placeholder="Your name"/></div>
                    <div class="mb-3"><label class="form-label" for="email" data-key="contact" data-value="contact-email">Your Email</label><input class="form-control item" type="text" name="subject" placeholder="example@example.com" required></div>
                    <div class="mb-3"></div>
                    <div class="mb-3"><label class="form-label" for="body" data-key="contact" data-value="contact-message">Message</label><textarea class="form-control item" name="body" placeholder="Your message"/></textarea></div>
                    <div class="mb-3 mt-4"><button class="btn btn-primary btn-lg d-block w-100 pageclip-form__submit" type="submit" onclick="sendEmail()" data-key="contact" data-value="contact-button">Send Message</button></div>
                </form>
            </div>
        </section>
    </main>
    <!-- shared-footer -->
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/bs-init.js"></script>
    <script src="assets/js/particles.min.js"></script>
    <script src="assets/js/contact-me.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/language.js"></script>
    <script src="assets/js/Lightbox-Gallery-baguetteBox.min.js"></script>
    <script src="assets/js/Lightbox-Gallery.js"></script>
    <script src="assets/js/pikaday.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="https://s.pageclip.co/v1/pageclip.js" charset="utf-8"></script>
    <script>
        var nombreInput = document.querySelector('[name="subject"]');
        // Personalizar el mensaje de validación requerido
        nombreInput.oninvalid = function(event) {
          event.target.setCustomValidity('Por favor, Ingrese correctamente su correo electrónico.');
        };
    
        // Restablecer el mensaje de validación cuando el input es válido
        nombreInput.oninput = function(event) {
          event.target.setCustomValidity('');
        };
      </script>
</body>

</html>
